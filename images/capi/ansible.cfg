[defaults]
remote_tmp = /tmp/.ansible
display_skipped_hosts = False
inject_facts_as_vars = False
pipelining = True
timeout = 60
# Drop concurrency to 1 to prevent overloading Packer's local loopback proxy
forks = 1

[ssh_connection]
# 1. Keep SFTP enabled
scp_if_ssh = True
transfer_method = sftp

# 2. REMOVE sftp_executable entirely so the GitHub runner uses its own default local path

# 3. FORCE the target Flatcar VM to use its correct internal subsystem path
ssh_args = -o ControlMaster=no -o ControlPath=none -o ControlPersist=no -o Subsystem="sftp /usr/lib64/misc/sftp-server"
pipelining = False