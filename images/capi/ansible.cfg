[defaults]
remote_tmp = /tmp/.ansible
display_skipped_hosts = False
inject_facts_as_vars = False
pipelining = True
timeout = 60
# Drop concurrency to 1 to prevent overloading Packer's local loopback proxy
forks = 1

[ssh_connection]
# Force SFTP mode cleanly
scp_if_ssh = True
transfer_method = sftp

# Use the exact validated Flatcar path
sftp_executable = /usr/lib64/misc/sftp-server

# Disable SSH multiplexing/pipelining which deadlocks the Packer proxy stream
pipelining = False
ssh_args = -o ControlMaster=no -o ControlPath=none -o ControlPersist=no
